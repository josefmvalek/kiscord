<!doctype html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kiscord</title>

  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" type="image/png" href="/img/app/czippel2_kytka-modified.png" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Performance Optimization: Preconnect to critical domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://nnrorazsiyiedwomgidf.supabase.co">

  
  
  <!-- Math Support: KaTeX loaded dynamically in modules -->

  
  
  <!-- Markdown & Highlighting loaded dynamically in modules -->
  
  <!-- Critical CSS: Login screen styles for instant rendering -->

  <meta name="theme-color" content="#202225" />
  <link rel="apple-touch-icon" href="/img/app/czippel2_kytka.jpg" />
  
  <!-- Fonts (Critical) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Secondary Fonts (Non-blocking) -->
  <link href="https://fonts.googleapis.com/css2?family=Consolas:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

  <!-- Early Theme Init to prevent flash -->
  <script>
    (function () {
      // 1. Theme Init
      const saved = localStorage.getItem('klarka_theme') || 'default';
      if (saved !== 'default') document.documentElement.classList.add('theme-' + saved);

      // 2. Pre-emptive Auth Check: Prevents login screen flicker for logged-in users
      window.addEventListener('DOMContentLoaded', () => {
        let hasSession = false;
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
            hasSession = true;
            break;
          }
        }
        if (!hasSession) {
          const loginScreen = document.getElementById('login-screen');
          if (loginScreen) loginScreen.style.display = 'flex';
        }
      });
    })();
  </script>
</head>

<body class="h-screen w-screen flex flex-col md:flex-row text-sm transition-colors duration-300">
  <!-- ========== LOGIN SCREEN ========== -->
  <div id="login-screen" class="fixed inset-0 z-[200] bg-[#202225] flex items-center justify-center p-4">
    <div class="login-gradient z-0"></div>
    <div class="login-card animate-fade-in">
      <div class="text-6xl text-center mb-6">🦝</div>
      <h2 class="text-2xl font-bold text-white text-center mb-2">Vítej v Kiscordu</h2>
      <p class="text-gray-400 text-center mb-8 text-sm">Zadej své údaje pro vstup do našeho světa.</p>

      <form onsubmit="event.preventDefault(); window.handleLogin(this)" class="space-y-4">
        <div>
          <label class="block text-[#b9bbbe] text-[10px] font-bold uppercase mb-1">E-mail</label>
          <input type="email" name="email" required autocomplete="email"
            class="w-full bg-[#202225] text-white p-3 rounded border border-[#202225] outline-none focus:border-[#5865F2] transition">
        </div>
        <div>
          <label class="block text-[#b9bbbe] text-[10px] font-bold uppercase mb-1">Heslo</label>
          <input type="password" name="password" required autocomplete="current-password"
            class="w-full bg-[#202225] text-white p-3 rounded border border-[#202225] outline-none focus:border-[#5865F2] transition">
        </div>
        <button type="submit"
          class="w-full bg-[#5865F2] hover:bg-[#4752c4] text-white py-3 rounded font-bold transition shadow-lg mt-4 flex items-center justify-center gap-2">
          <span>Přihlásit se</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </button>
        <p id="login-error" class="hidden text-red-400 text-center text-xs mt-4"></p>
      </form>
    </div>
  </div>

  <!-- ========== MAIN APP ========== -->
  <div id="app-interface" class="flex w-full h-full transition-opacity duration-1000 opacity-0">
    <!-- SERVER LIST -->
    <div id="sidebar-wrapper"
      class="fixed inset-y-0 left-0 z-50 flex h-full transition-transform duration-300 transform -translate-x-full md:relative md:translate-x-0 shadow-2xl md:shadow-none">
      <div
        class="bg-[var(--bg-tertiary)] w-[72px] flex flex-col items-center py-3 gap-2 flex-shrink-0 border-r border-[var(--border-subtle)]">
        <div
          class="w-12 h-12 bg-[var(--bg-primary)] rounded-full hover:rounded-2xl hover:bg-[var(--blurple)] transition-all cursor-pointer flex items-center justify-center text-[var(--text-normal)] hover:text-white mb-2">
          <i class="fab fa-discord text-xl"></i>
        </div>
        <div class="w-8 h-[2px] bg-[var(--border-subtle)] rounded mb-2"></div>
        <div
          class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-500 rounded-2xl cursor-pointer flex items-center justify-center overflow-hidden">
          <div
            class="w-12 h-12 rounded-2xl cursor-pointer flex items-center justify-center overflow-hidden shadow-lg group transition-all duration-200">
            <img id="server-icon" src="/img/app/czippel2_vanoce.png" alt="K&T Server" class="w-full h-full object-cover" loading="lazy" />
          </div>
        </div>
      </div>

      <div class="bg-[var(--bg-secondary)] w-60 flex flex-col flex-shrink-0 border-r border-[var(--border-subtle)]">
        <div
          class="h-12 border-b border-[var(--border-subtle)] flex items-center justify-between px-4 font-bold text-[var(--text-header)] hover:bg-[var(--bg-modifier-hover)] cursor-pointer transition">
          <span class="truncate">Kiscord 🦝🤍🦉</span>
          <button onclick="toggleValentineMode()" class="text-xs hover:text-[#eb459e] transition p-1"
            title="Přepnout Valentýnský Theme">
            <i class="fas fa-heart"></i>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto py-3 custom-scrollbar">
          <div id="channels-container"></div>
        </div>
        <div
          class="h-[52px] bg-[var(--bg-tertiary)] flex items-center px-2 w-full cursor-pointer hover:bg-[var(--bg-modifier-hover)] transition select-none border-t border-[var(--border-subtle)]"
          onclick="toggleUserPopout()">
          <div class="relative w-8 h-8 mr-2 group">
            <img id="sidebar-user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%235865F2'/%3E%3Ctext x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E🦝%3C/text%3E%3C/svg%3E" alt="Avatar"
              class="w-8 h-8 rounded-full object-cover" loading="lazy" />
            <div
              class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-[var(--green)] rounded-full border-2 border-[var(--bg-tertiary)]">
            </div>
          </div>
          <div class="flex-1 overflow-hidden">
            <div id="sidebar-user-name" class="text-[var(--text-header)] text-xs font-bold truncate">&nbsp;</div>
            <div class="text-[var(--text-muted)] text-[10px] truncate">
              #1337 • <span id="user-status">Online</span>
            </div>
          </div>
          <button onclick="event.stopPropagation(); window.switchChannel('settings')" class="w-8 h-8 flex flex-shrink-0 items-center justify-center text-[var(--text-muted)] hover:text-[var(--text-header)] hover:bg-[var(--bg-modifier-hover)] rounded-lg transition-all" title="Otevřít Nastavení">
            <i class="fas fa-cog text-sm hover:rotate-90 transition-transform duration-300"></i>
          </button>
        </div>
      </div>
    </div>


    <div id="mobile-overlay" onclick="toggleMobileMenu()"
      class="fixed inset-0 bg-black/60 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- MAIN CONTENT AREA -->
    <div class="bg-[var(--bg-primary)] flex-1 flex flex-col min-w-0 relative z-10 overflow-hidden h-screen">

      <div
        class="h-12 border-b border-[var(--border-subtle)] flex items-center px-4 shadow-sm z-20 bg-[var(--bg-primary)] flex-shrink-0">
        <button onclick="toggleMobileMenu()"
          class="md:hidden mr-4 text-[var(--text-muted)] hover:text-[var(--text-header)] focus:outline-none">
          <i class="fas fa-bars text-xl"></i>
        </button>

        <i id="channel-icon" class="fas fa-hashtag text-[var(--text-muted)] text-xl mr-2"></i>
        <span id="channel-name" class="font-bold text-[var(--text-header)] mr-4 truncate">&nbsp;</span>
        <span id="channel-desc" class="text-xs text-[var(--text-muted)] truncate hidden md:block">&nbsp;</span>
        <div class="ml-auto flex items-center gap-4 text-[var(--text-muted)]">
          <div class="bg-[var(--bg-tertiary)] border border-[var(--border-subtle)] px-2.5 py-1 rounded-xl text-xs flex items-center gap-2 w-32 md:w-48">
            <input type="text" placeholder="Hledat..." class="bg-transparent text-[var(--text-header)] placeholder-[var(--text-muted)] focus:outline-none w-full"
              id="search-input" />
            <i class="fas fa-search text-xs text-[var(--text-muted)]"></i>
          </div>
        </div>
      </div>

      <!-- Content Container -->
      <div id="messages-container"
        class="flex-1 overflow-y-auto min-h-0 px-0 py-0 custom-scrollbar flex flex-col bg-[var(--bg-primary)] relative"></div>
    </div>


    <!-- MEMBER LIST -->
    <div
      class="w-60 bg-[var(--bg-secondary)] hidden lg:flex flex-col p-3 flex-shrink-0 border-l border-[var(--border-subtle)] z-20">
      <h3 class="text-xs font-bold text-[var(--text-muted)] uppercase mb-2 px-2">
        ONLINE — 2
      </h3>
      <div class="flex items-center gap-3 px-2 py-1.5 rounded-lg hover:bg-[var(--bg-modifier-hover)] cursor-pointer group">
        <div class="relative">
          <img id="online-avatar-jozka" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%235865F2'/%3E%3Ctext x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E🦝%3C/text%3E%3C/svg%3E" alt="Jožka" class="w-8 h-8 rounded-full object-cover"
            loading="lazy" />
          <div
            class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-[var(--green)] rounded-full border-2 border-[var(--bg-secondary)]">
          </div>
        </div>
        <div>
          <div class="font-bold text-[var(--text-header)] text-sm">Jožka</div>
          <div class="text-xs text-[var(--text-muted)]">
            Hraje Tetris <span class="text-[var(--pink)]">🧩</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-3 px-2 py-1.5 rounded-lg hover:bg-[var(--bg-modifier-hover)] cursor-pointer group mt-1">
        <div class="relative">
          <img id="online-avatar-klarka" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23eb459e'/%3E%3Ctext x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E🦉%3C/text%3E%3C/svg%3E" alt="Klárka" class="w-8 h-8 rounded-full object-cover" />
          <div
            class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-[var(--green)] rounded-full border-2 border-[var(--bg-secondary)]">
          </div>
        </div>
        <div>
          <div class="font-bold text-[var(--text-header)] text-sm">Klárka</div>
          <div class="text-xs text-[var(--text-muted)]">Vrchní Fact-Checker</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Settings Quick Button -->
  <button id="floating-settings-btn" onclick="window.switchChannel('settings')"
    class="fixed bottom-5 right-5 z-40 w-11 h-11 bg-[var(--bg-secondary)] hover:bg-[var(--blurple)] text-[var(--text-normal)] hover:text-white rounded-2xl border border-[var(--border-subtle)] shadow-2xl flex items-center justify-center text-base transition-all duration-300 hover:scale-110 active:scale-95 group"
    title="Otevřít Nastavení">
    <i class="fas fa-cog group-hover:rotate-90 transition-transform duration-500"></i>
  </button>

  <!-- ========== MODALS ========== -->


  <!-- Non-critical scripts/styles loaded at the end -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" />

  <!-- Export Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <script type="module" src="/js/main.js"></script>

</body>
</html>
