<!doctype html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kiscord</title>

  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" type="image/png" href="/img/app/czippel2_kytka-modified.png" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Performance Optimization: Preconnect to critical domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://nnrorazsiyiedwomgidf.supabase.co">

  
  
  <!-- Math Support: KaTeX loaded dynamically in modules -->

  
  
  <!-- Markdown & Highlighting loaded dynamically in modules -->
  
  <!-- Critical CSS: Login screen styles for instant rendering -->

  <meta name="theme-color" content="#202225" />
  <link rel="apple-touch-icon" href="/img/app/czippel2_kytka.jpg" />
  
  <!-- Fonts (Critical) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Secondary Fonts (Non-blocking) -->
  <link href="https://fonts.googleapis.com/css2?family=Consolas:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

  <!-- Early Theme Init to prevent flash -->
  <script>
    (function () {
      // 1. Theme Init
      const saved = localStorage.getItem('klarka_theme') || 'default';
      if (saved !== 'default') document.documentElement.classList.add('theme-' + saved);

      // 2. Pre-emptive Auth Check: Prevents login screen flicker for logged-in users
      window.addEventListener('DOMContentLoaded', () => {
        let hasSession = false;
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
            hasSession = true;
            break;
          }
        }
        if (!hasSession) {
          const loginScreen = document.getElementById('login-screen');
          if (loginScreen) loginScreen.style.display = 'flex';
        }
      });
    })();
  </script>
</head>

<body class="h-screen w-screen flex flex-col md:flex-row text-sm transition-colors duration-300">
  <!-- ========== LOGIN SCREEN ========== -->
  <div id="login-screen" class="fixed inset-0 z-[200] bg-[#202225] flex items-center justify-center p-4">
    <div class="login-gradient z-0"></div>
    <div class="login-card animate-fade-in">
      <div class="text-6xl text-center mb-6">🦝</div>
      <h2 class="text-2xl font-bold text-white text-center mb-2">Vítej v Kiscordu</h2>
      <p class="text-gray-400 text-center mb-8 text-sm">Zadej své údaje pro vstup do našeho světa.</p>

      <form onsubmit="event.preventDefault(); window.handleLogin(this)" class="space-y-4">
        <div>
          <label class="block text-[#b9bbbe] text-[10px] font-bold uppercase mb-1">E-mail</label>
          <input type="email" name="email" required autocomplete="email"
            class="w-full bg-[#202225] text-white p-3 rounded border border-[#202225] outline-none focus:border-[#5865F2] transition">
        </div>
        <div>
          <label class="block text-[#b9bbbe] text-[10px] font-bold uppercase mb-1">Heslo</label>
          <input type="password" name="password" required autocomplete="current-password"
            class="w-full bg-[#202225] text-white p-3 rounded border border-[#202225] outline-none focus:border-[#5865F2] transition">
        </div>
        <button type="submit"
          class="w-full bg-[#5865F2] hover:bg-[#4752c4] text-white py-3 rounded font-bold transition shadow-lg mt-4 flex items-center justify-center gap-2">
          <span>Přihlásit se</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </button>
        <p id="login-error" class="hidden text-red-400 text-center text-xs mt-4"></p>
      </form>
    </div>
  </div>

  <!-- ========== MAIN APP ========== -->
  <div id="app-interface" class="flex w-full h-full transition-opacity duration-1000 opacity-0">
    <!-- SERVER LIST -->
    <div id="sidebar-wrapper"
      class="fixed inset-y-0 left-0 z-50 flex h-full transition-transform duration-300 transform -translate-x-full md:relative md:translate-x-0 shadow-2xl md:shadow-none">
      <div id="servers-sidebar"
        class="bg-[var(--bg-tertiary)] w-[72px] flex flex-col items-center py-3 gap-1.5 flex-shrink-0 border-r border-[var(--border-subtle)] overflow-y-auto no-scrollbar select-none">
        <div id="servers-container" class="flex flex-col items-center gap-1.5 w-full"></div>
      </div>

      <div class="bg-[var(--bg-secondary)] w-60 flex flex-col flex-shrink-0 border-r border-[var(--border-subtle)]">
        <div id="server-header-container"
          class="h-12 border-b border-[var(--border-subtle)] flex items-center justify-between px-4 font-bold text-[var(--text-header)] hover:bg-[var(--bg-modifier-hover)] cursor-pointer transition select-none">
          <div class="flex items-center gap-2 min-w-0">
            <span id="server-header-title" class="truncate text-sm font-extrabold tracking-wide">Kiscord Hub</span>
          </div>
          <button onclick="toggleValentineMode()" class="text-xs hover:text-[#eb459e] transition p-1 flex-shrink-0"
            title="Přepnout Valentýnský Theme">
            <i class="fas fa-heart"></i>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto py-3 custom-scrollbar">
          <div id="channels-container"></div>
        </div>
        <div
          class="h-[52px] bg-[var(--bg-tertiary)] flex items-center px-2 w-full cursor-pointer hover:bg-[var(--bg-modifier-hover)] transition select-none border-t border-[var(--border-subtle)]"
          onclick="toggleUserPopout()">
          <div class="relative w-8 h-8 mr-2 group">
            <img id="sidebar-user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%235865F2'/%3E%3Ctext x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E🦝%3C/text%3E%3C/svg%3E" alt="Avatar"
              class="w-8 h-8 rounded-full object-cover" loading="lazy" />
            <div
              class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-[var(--green)] rounded-full border-2 border-[var(--bg-tertiary)]">
            </div>
          </div>
          <div class="flex-1 overflow-hidden">
            <div id="sidebar-user-name" class="text-[var(--text-header)] text-xs font-bold truncate">&nbsp;</div>
            <div class="text-[var(--text-muted)] text-[10px] truncate">
              #1337 • <span id="user-status">Online</span>
            </div>
          </div>
          <button onclick="event.stopPropagation(); window.switchChannel('settings')" class="w-8 h-8 flex flex-shrink-0 items-center justify-center text-[var(--text-muted)] hover:text-[var(--text-header)] hover:bg-[var(--bg-modifier-hover)] rounded-lg transition-all" title="Otevřít Nastavení">
            <i class="fas fa-cog text-sm hover:rotate-90 transition-transform duration-300"></i>
          </button>
        </div>
      </div>
    </div>


    <div id="mobile-overlay" onclick="toggleMobileMenu()"
      class="fixed inset-0 bg-black/60 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- MAIN CONTENT AREA -->
    <div class="bg-[var(--bg-primary)] flex-1 flex flex-col min-w-0 relative z-10 overflow-hidden h-screen">

      <div
        class="h-12 border-b border-[var(--border-subtle)] flex items-center px-4 shadow-sm z-20 bg-[var(--bg-primary)] flex-shrink-0">
        <button onclick="toggleMobileMenu()"
          class="md:hidden mr-4 text-[var(--text-muted)] hover:text-[var(--text-header)] focus:outline-none">
          <i class="fas fa-bars text-xl"></i>
        </button>

        <i id="channel-icon" class="fas fa-hashtag text-[var(--text-muted)] text-xl mr-2"></i>
        <span id="channel-name" class="font-bold text-[var(--text-header)] mr-4 truncate">&nbsp;</span>
        <span id="channel-desc" class="text-xs text-[var(--text-muted)] truncate hidden md:block">&nbsp;</span>
        
        <!-- Offline Status Badge -->
        <div id="header-offline-badge" class="hidden items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-400 text-[10px] font-black uppercase tracking-wider flex-shrink-0 animate-pulse select-none" title="Změny jsou uloženy v zařízení a čekají na odeslání">
          <i class="fas fa-cloud-upload-alt text-[9px]"></i>
          <span id="header-offline-text">Offline</span>
        </div>

        <div class="ml-auto flex items-center gap-3 text-[var(--text-muted)]">
          <div onclick="window.openCommandPalette ? window.openCommandPalette() : null" 
               class="bg-[var(--bg-tertiary)] hover:bg-[var(--bg-modifier-hover)] border border-[var(--border-subtle)] hover:border-[var(--border-strong)] px-3 py-1.5 rounded-xl text-xs flex items-center gap-2 cursor-pointer transition shadow-sm group select-none">
            <i class="fas fa-search text-xs text-[var(--text-muted)] group-hover:text-[var(--text-header)] transition-colors"></i>
            <span class="text-xs text-[var(--text-muted)] group-hover:text-[var(--text-normal)] hidden sm:inline transition-colors">Hledat kanál či akci...</span>
            <span class="text-xs text-[var(--text-muted)] group-hover:text-[var(--text-normal)] sm:hidden transition-colors">Hledat...</span>
            <kbd class="hidden md:inline-flex items-center text-[9px] font-black uppercase px-1.5 py-0.5 rounded bg-[var(--bg-secondary)] border border-[var(--border-subtle)] text-[var(--text-muted)] group-hover:text-[var(--text-header)] group-hover:border-[var(--border-strong)] transition-all">Ctrl K</kbd>
          </div>
        </div>
      </div>

      <!-- Content Container -->
      <div id="messages-container"
        class="flex-1 overflow-y-auto min-h-0 px-0 py-0 pb-16 md:pb-0 custom-scrollbar flex flex-col bg-[var(--bg-primary)] relative"></div>
    </div>


    <!-- MEMBER LIST -->
    <div
      class="w-60 bg-[var(--bg-secondary)] hidden lg:flex flex-col p-3 flex-shrink-0 border-l border-[var(--border-subtle)] z-20">
      <h3 class="text-xs font-bold text-[var(--text-muted)] uppercase mb-2 px-2">
        ONLINE — 2
      </h3>
      <div class="flex items-center gap-3 px-2 py-1.5 rounded-lg hover:bg-[var(--bg-modifier-hover)] cursor-pointer group">
        <div class="relative">
          <img id="online-avatar-jozka" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%235865F2'/%3E%3Ctext x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E🦝%3C/text%3E%3C/svg%3E" alt="Jožka" class="w-8 h-8 rounded-full object-cover"
            loading="lazy" />
          <div
            class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-[var(--green)] rounded-full border-2 border-[var(--bg-secondary)]">
          </div>
        </div>
        <div>
          <div class="font-bold text-[var(--text-header)] text-sm">Jožka</div>
          <div class="text-xs text-[var(--text-muted)]">
            Hraje Tetris <span class="text-[var(--pink)]">🧩</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-3 px-2 py-1.5 rounded-lg hover:bg-[var(--bg-modifier-hover)] cursor-pointer group mt-1">
        <div class="relative">
          <img id="online-avatar-klarka" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23eb459e'/%3E%3Ctext x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E🦉%3C/text%3E%3C/svg%3E" alt="Klárka" class="w-8 h-8 rounded-full object-cover" />
          <div
            class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-[var(--green)] rounded-full border-2 border-[var(--bg-secondary)]">
          </div>
        </div>
        <div>
          <div class="font-bold text-[var(--text-header)] text-sm">Klárka</div>
          <div class="text-xs text-[var(--text-muted)]">Vrchní Fact-Checker</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Settings Quick Button (Desktop only) -->
  <button id="floating-settings-btn" onclick="window.switchChannel('settings')"
    class="hidden md:flex fixed bottom-5 right-5 z-40 w-11 h-11 bg-[var(--bg-secondary)] hover:bg-[var(--blurple)] text-[var(--text-normal)] hover:text-white rounded-2xl border border-[var(--border-subtle)] shadow-2xl items-center justify-center text-base transition-all duration-300 hover:scale-110 active:scale-95 group"
    title="Otevřít Nastavení">
    <i class="fas fa-cog group-hover:rotate-90 transition-transform duration-500"></i>
  </button>

  <!-- Persistent Floating Workout Mini-Bar (Dynamic Island Style) -->
  <div id="global-workout-mini-bar" 
       class="hidden fixed bottom-[76px] md:bottom-5 left-3.5 right-3.5 md:left-auto md:right-5 md:w-96 z-40 bg-[#16171a]/95 backdrop-blur-2xl border border-white/10 rounded-2xl shadow-[0_12px_36px_rgba(0,0,0,0.65)] p-2 px-3 items-center justify-between transition-all duration-300 select-none cursor-pointer active:scale-[0.99] group hover:border-amber-500/40"
       onclick="window.switchChannel('gym-tracker')">
    <div class="flex items-center gap-3 min-w-0 flex-1">
      <div class="w-9 h-9 rounded-xl bg-amber-500/15 border border-amber-500/25 text-amber-400 flex items-center justify-center text-sm flex-shrink-0 shadow-inner group-hover:scale-105 transition-transform">
        <i class="fas fa-dumbbell" id="mini-bar-icon"></i>
      </div>
      <div class="min-w-0 flex-1 flex flex-col justify-center">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="text-xs font-bold text-white truncate" id="mini-bar-title">Trénink</span>
          <span class="w-1 h-1 rounded-full bg-white/20 flex-shrink-0"></span>
          <span class="text-[11px] text-amber-400/90 font-mono font-bold flex-shrink-0" id="mini-bar-timer">00:00</span>
        </div>
        <div class="flex items-center gap-1.5 min-w-0 mt-0.5">
          <span class="text-[11px] font-medium text-gray-300 truncate min-w-0 flex-1" id="mini-bar-subtitle">Probíhá cvičení...</span>
          <span class="flex-shrink-0 px-1.5 py-0.5 rounded-md bg-amber-500/20 text-amber-300 font-bold text-[10px] border border-amber-500/30" id="mini-bar-set-badge">S1/4</span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0 ml-2.5">
      <!-- Direct Quick-Set Action directly from Dynamic Island -->
      <button id="mini-bar-quick-set-btn" 
              onclick="event.stopPropagation(); window.logCurrentMiniBarSet ? window.logCurrentMiniBarSet() : null;"
              class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black text-[11px] font-black uppercase tracking-wider transition-all shadow-md active:scale-95 flex items-center gap-1.5 flex-shrink-0"
              title="Označit sérii za hotovou a spustit pauzu">
        <i class="fas fa-check text-[10px]"></i>
        <span id="mini-bar-btn-text">+ Série</span>
      </button>
    </div>
  </div>

  <!-- Floating Action Button (Thumb-Zone FAB) for Mobile -->
  <div id="mobile-fab-container" class="fixed bottom-[72px] right-3.5 z-40 md:hidden flex flex-col items-end gap-2 select-none">
    <!-- Speed Dial Sheet -->
    <div id="mobile-fab-sheet" class="hidden flex-col items-end gap-2 mb-1 animate-scale-spring">
      <button onclick="window.quickLogWater ? window.quickLogWater() : null; window.toggleMobileFab();" 
              class="px-3.5 py-2 rounded-2xl bg-[var(--bg-secondary)]/95 backdrop-blur-md border border-[#00aff4]/40 text-sky-400 text-[11px] font-black uppercase tracking-wider shadow-2xl flex items-center gap-2 active-pop">
        <span>+250ml Vody</span> <i class="fas fa-tint text-sm"></i>
      </button>
      <button onclick="window.switchChannel('habits'); window.toggleMobileFab();" 
              class="px-3.5 py-2 rounded-2xl bg-[var(--bg-secondary)]/95 backdrop-blur-md border border-[#3ba55c]/40 text-emerald-400 text-[11px] font-black uppercase tracking-wider shadow-2xl flex items-center gap-2 active-pop">
        <span>Návyky</span> <i class="fas fa-check-circle text-sm"></i>
      </button>
      <button onclick="window.showQuickPlanModal ? window.showQuickPlanModal(1) : window.switchChannel('dashboard'); window.toggleMobileFab();" 
              class="px-3.5 py-2 rounded-2xl bg-[var(--bg-secondary)]/95 backdrop-blur-md border border-[#eb459e]/40 text-pink-400 text-[11px] font-black uppercase tracking-wider shadow-2xl flex items-center gap-2 active-pop">
        <span>Plán / Rande</span> <i class="fas fa-heart text-sm"></i>
      </button>
    </div>

    <!-- Main FAB Trigger -->
    <button id="mobile-fab-main-btn" onclick="window.toggleMobileFab()" 
            class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-[var(--blurple)] to-[var(--pink)] text-white shadow-[0_8px_25px_rgba(88,101,242,0.5)] border border-white/20 flex items-center justify-center text-lg active-pop transition-transform duration-300"
            title="Rychlé akce">
      <i id="mobile-fab-icon" class="fas fa-plus transition-transform duration-300"></i>
    </button>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav id="mobile-bottom-nav" class="fixed bottom-0 inset-x-0 z-40 bg-[var(--bg-secondary)]/95 backdrop-blur-xl border-t border-[var(--border-subtle)] flex md:hidden items-center justify-around px-1 py-1.5 transition-transform duration-300 select-none shadow-[0_-8px_25px_rgba(0,0,0,0.4)]">
    <button class="mobile-nav-btn flex-1 py-1 flex flex-col items-center justify-center text-[var(--text-muted)] transition active:scale-95 group" data-nav-channel="dashboard" onclick="window.switchChannel('dashboard')">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center text-base text-pink-500 nav-icon-box transition">
        <i class="fas fa-heart"></i>
      </div>
      <span class="text-[9px] font-black uppercase tracking-tight nav-label">Můj Den</span>
    </button>

    <button class="mobile-nav-btn flex-1 py-1 flex flex-col items-center justify-center text-[var(--text-muted)] transition active:scale-95 group" data-nav-channel="calendar" onclick="window.switchChannel('calendar')">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center text-base text-[#5865F2] nav-icon-box transition">
        <i class="fas fa-calendar-alt"></i>
      </div>
      <span class="text-[9px] font-black uppercase tracking-tight nav-label">Kalendář</span>
    </button>

    <button class="mobile-nav-btn flex-1 py-1 flex flex-col items-center justify-center text-[var(--text-muted)] transition active:scale-95 group relative" data-nav-channel="gym-tracker" onclick="window.switchChannel('gym-tracker')">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center text-base text-amber-400 nav-icon-box transition relative">
        <i class="fas fa-dumbbell"></i>
        <span id="mobile-nav-gym-dot" class="hidden absolute top-0.5 right-0.5 w-2 h-2 bg-amber-400 rounded-full animate-ping"></span>
      </div>
      <span class="text-[9px] font-black uppercase tracking-tight nav-label">Posilovna</span>
    </button>

    <button class="mobile-nav-btn flex-1 py-1 flex flex-col items-center justify-center text-[var(--text-muted)] transition active:scale-95 group" data-nav-category="vut" onclick="window.toggleMobileCategorySheet('vut')">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center text-base text-emerald-400 nav-icon-box transition">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <span class="text-[9px] font-black uppercase tracking-tight nav-label">Kolej & FIT</span>
    </button>

    <button class="mobile-nav-btn flex-1 py-1 flex flex-col items-center justify-center text-[var(--text-muted)] transition active:scale-95 group" data-nav-category="more" onclick="window.toggleMobileCategorySheet('more')">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center text-base text-purple-400 nav-icon-box transition">
        <i class="fas fa-bars"></i>
      </div>
      <span class="text-[9px] font-black uppercase tracking-tight nav-label">Více</span>
    </button>
  </nav>

  <!-- Mobile Category Bottom Sheet Drawer -->
  <div id="mobile-sheet-backdrop" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 md:hidden" onclick="window.closeMobileCategorySheet()">
    <div id="mobile-sheet-content" class="fixed bottom-0 inset-x-0 bg-[var(--bg-secondary)] border-t border-[var(--border-subtle)] rounded-t-3xl p-5 shadow-2xl transform translate-y-full transition-transform duration-300 max-h-[85vh] overflow-y-auto custom-scrollbar" onclick="event.stopPropagation()">
      <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-4"></div>
      <div id="mobile-sheet-body"></div>
    </div>
  </div>

  <!-- ========== MODALS ========== -->


  <!-- Non-critical scripts/styles loaded at the end -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" />
  
  <!-- debug.js: Odkomentuj pro lokální ladění, v produkci nechat zakomentováno -->
  <!-- <script type="module" src="/js/debug.js"></script> -->
  <!-- Export Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <script type="module" src="/js/main.js"></script>

</body>
</html>
